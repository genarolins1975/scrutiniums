"false\" data-tippreview-image=\"\" data-tippreview-title=\"\" href=\"https://www.gov.br/aneel/pt-br/assuntos/instrumentos-regulatorios/agenda-regulatoria/2016-2018\" target=\"_blank\" title=\"\">2016&nbsp;- 2018<\/a>&nbsp; |&nbsp;&nbsp;<a class=\"internal-link\" data-mce-href=\"https://www.gov.br/aneel/pt-br/assuntos/instrumentos-regulatorios/agenda-regulatoria/2015-2016\" data-tippreview-enabled=\"false\" data-tippreview-image=\"\" data-tippreview-title=\"\" href=\"https://www.gov.br/aneel/pt-br/assuntos/instrumentos-regulatorios/agenda-regulatoria/2015-2016\" target=\"_blank\" title=\"\">2015 - 2016<\/a><\/p>"}, "8fa83e73-d948-49ce-bc8e-01d3f73d303e": {"@type": "slate", "plaintext": "Consulte as Agendas Regulatórias por período", "value": [{"children": [{"text": "Consulte as Agendas Regulatórias por período"}], "type": "h3"}]}, "a94f18fc-0618-49bf-9616-387d8a862067": {"@type": "html", "html": "<p style=\"text-align: justify;\">Conheça a Agenda Regulatória da ANEEL para 2026-2027, aprovada pela <a class=\"external-link\" data-mce-href=\"https://www2.aneel.gov.br/cedoc/prt20257030.pdf\" style=\"\" data-tippreview-enabled=\"false\" data-tippreview-image=\"\" data-tippreview-title=\"\" href=\"https://www2.aneel.gov.br/cedoc/prt20257030.pdf\" target=\"_blank\" title=\"\">Portaria ANEEL nº 7.030, de 2 de dezembro de 2025<\/a>, atualizada pela <a class=\"external-link\" data-mce-href=\"https://leis.org/aneel/lei/portaria/2026/7157/portaria-n-7157-2026-resolve-art-1-aprovar-a-primeira-revisao-da-agenda-regulatoria-da-aneel-para-o-bienio-2026-2027art-2-o-anexo-i-da/?termo=agenda%20regulat%C3%B3ria\" data-tippreview-enabled=\"false\" data-tippreview-image=\"\" data-tippreview-title=\"\" href=\"https://leis.org/aneel/lei/portaria/2026/7157/portaria-n-7157-2026-resolve-art-1-aprovar-a-primeira-revisao-da-agenda-regulatoria-da-aneel-para-o-bienio-2026-2027art-2-o-anexo-i-da/?termo=agenda%20regulat%C3%B3ria\" target=\"_blank\" title=\"\">Portaria nº 7.157, de 8 de setembro de 2026<\/a>.&nbsp;Trata-se de um importante instrumento de transparência, diálogo e controle, pois permite que qualquer interessado acompanhe o planejamento das atividades regulatórias da Agência.<\/p>"}, "aa2ad5b2-b676-4718-8f77-b92ee6332379": {"@type": "SectionTitleBlock", "title": "Agenda Regulatória"}, "bb93820b-866c-4594-8082-40a574c2bdf9": {"@type": "html", "html": "<p style=\"text-align: justify;\">De acordo com a <a class=\"external-link\" data-mce-href=\"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2019/lei/l13848.htm\" style=\"\" data-tippreview-enabled=\"false\" data-tippreview-image=\"\" data-tippreview-title=\"\" href=\"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2019/lei/l13848.htm\" target=\"_blank\" title=\"\">Lei nº 13.848/2019<\/a>, a Agenda Regulatória deverá apresentar a relação de atividades prioritárias e que serão normatizadas durante o período de sua vigência. No entanto, o cronograma de atividades regulatórias da Agência vai além e abrange três classificações: além da <strong>Agenda Regulatória<\/strong>, apresenta também as <strong>Demais Atividades Regulatórias<\/strong> e as <strong>Avaliações de Resultado Regulatório (ARR)<\/strong>. Confira abaixo as diferenças entre cada uma delas.<\/p>"}, "e25b9ccd-0fea-4b73-a62f-6647ed80a12f": {"@type": "columnsBlock", "data": {"blocks": {"657e907c-7eef-4e93-a934-29271653e89d": {"blocks": {"512cf170-56bd-4a38-b6b6-7198592d8012": {"@type": "image", "align": "left", "alt": "", "image_scales": {"image": [{"content-type": "image/png", "download": "@@images/image-960-7a23abeef13466ed2876517b8bfed613.png", "filename": "ccbea3975d75467a91ffceb9f5237fd6.png", "height": 541, "scales": {"icon": {"download": "@@images/image-32-0561594472e124ac501259b55dbb3c67.png", "height": 18, "width": 32}, "large": {"download": "@@images/image-800-e8305b0ad7ea3981dbb7a65ecf60d5ff.png", "height": 450, "width": 800}, "mini": {"download": "@@images/image-200-c660cd4e6ed5e9c8f47d342b2d6130da.png", "height": 112, "width": 200}, "preview": {"download": "@@images/image-400-59865906b082f3e9b645bc0d2573c087.png", "height": 225, "width": 400}, "teaser": {"download": "@@images/image-600-452e431130980f56277c2e9a54d2b163.png", "height": 338, "width": 600}, "thumb": {"download": "@@images/image-128-4befd306742c6f466b34d99464ac44e9.png", "height": 72, "width": 128}, "tile": {"download": "@@images/image-64-7ff9a26b0c6f108bb9a3c79947c1414d.png", "height": 36, "width": 64}}, "size": 230565, "width": 960}]}, "mceSrc": "./resolveuid/e33f6c0f3d1041e09105153ce8db130f/@@images/image/preview", "size": "l", "title": "", "url": "https://www.gov.br/aneel/pt-br/assuntos/governanca-regulatoria/agenda-regulatoria/ccbea3975d75467a91ffceb9f5237fd6.png"}, "9bd705d3-9013-4255-acb0-b4f56dbcfb2c": {"@type": "html", "html": "<p style=\"text-align: justify;\">O <a class=\"external-link\" data-mce-href=\"https://app.powerbi.com/view?r=eyJrIjoiYWJlYzViNGEtZWZlOC00NmY2LTkwMDEtMTI0ODg1ZTM0MmE1IiwidCI6IjQwZDZmOWI4LWVjYTctNDZhMi05MmQ0LWVhNGU5YzAxNzBlMSIsImMiOjR9\" style=\"\" data-tippreview-enabled=\"false\" data-tippreview-image=\"\" data-tippreview-title=\"\" href=\"https://app.powerbi.com/view?r=eyJrIjoiYWJlYzViNGEtZWZlOC00NmY2LTkwMDEtMTI0ODg1ZTM0MmE1IiwidCI6IjQwZDZmOWI4LWVjYTctNDZhMi05MmQ0LWVhNGU5YzAxNzBlMSIsImMiOjR9\" target=\"_blank\" title=\"\">Cronograma<\/a> apresenta, dentro das três classificações de Atividades Regulatórias, o planejamento das etapas de cada uma das atividades.&nbsp; Esse planejamento poderá ser reprogramado, ao final de cada ano, em função dos resultados das AIR – Análises de Impacto Regulatório ou de mudanças no contexto da intervenção regulatória. Além disso, as atividades estão&nbsp;agrupadas em quatro Eixos Temáticos, com o objetivo de facilitar as discussões da Diretoria Colegiada da ANEEL com os especialistas da Agência para a elaboração de normas cada vez mais claras e eficientes.&nbsp;<a class=\"external-link\" data-mce-href=\"https://git.aneel.gov.br/publico/centralconteudo/-/raw/main/Assuntos/Instrumentos-Regulatorios/agenda-regulatoria/TUTORIAL_Cronograma-BI_v2_7-1-24.pdf\" style=\"\" data-tippreview-enabled=\"true\" data-tippreview-image=\"\" data-tippreview-title=\"\" href=\"https://git.aneel.gov.br/publico/centralconteudo/-/raw/main/Assuntos/Instrumentos-Regulatorios/agenda-regulatoria/TUTORIAL_Cronograma-BI_v2_7-1-24.pdf\" target=\"_blank\" title=\"\">Acesse o tutorial sobre o painel<\/a>&nbsp;(arquivo em PDF).<\/p>"}}, "blocks_layout": {"items": ["512cf170-56bd-4a38-b6b6-7198592d8012", "9bd705d3-9013-4255-acb0-b4f56dbcfb2c"]}}}, "blocks_layout": {"items": ["657e907c-7eef-4e93-a934-29271653e89d"]}}, "gridCols": ["full"], "gridSize": 12}, "f01161a5-e7fc-4d0c-a684-dbe09add65d9": {"@type": "columnsBlock", "data": {"blocks": {"96dd7dd2-25e8-4a9f-91d1-242040c84d9b": {"blocks": {"483631cc-6eb5-4ca4-a9b2-85dbfc921047": {"@type": "html", "html": "<p style=\"text-align: justify;\">Conheça o&nbsp;<a data-mce-href=\"https://www.gov.br/mme/pt-br/assuntos/analise-de-impacto-regulatorio-air-e-avaliacao-de-resultado-regulatorio-arr/o-que-e-arr/guiaarrverso5.pdf\" href=\"https://www.gov.br/mme/pt-br/assuntos/analise-de-impacto-regulatorio-air-e-avaliacao-de-resultado-regulatorio-arr/o-que-e-arr/guiaarrverso5.pdf\">Guia de ARR<\/a>&nbsp;(arquivo em PDF), instrumento que&nbsp;propõe um roteiro básico para a ARR, a partir das melhores práticas internacionais.<\/p>"}, "6c4d361e-bc64-4a85-81c6-43e8e08300a8": {"@type": "slate", "plaintext": "2 - Avaliações de ResultadoRegulatório - ARR", "value": [{"children": [{"text": "2 - Avaliações de Resultado\nRegulatório - ARR"}], "type": "h3"}]}, "7e89dbd3-f33b-4346-b2e8-656845f69ff3": {"@type": "html", "html": "<p style=\"text-align: justify;\">Consiste na&nbsp;<span class=\"fontColorThemeDarkAlt\"><span>verificação dos efeitos<\/span><\/span>&nbsp;decorrentes da edição de ato normativo, considerados o alcance dos objetivos originalmente pretendidos e os demais impactos observados sobre o mercado e a sociedade, em decorrência de sua implementação.<\/p>"}, "a8cfa086-99b3-460d-ba4c-ef73f45cd3eb": {"@type": "html", "html": "<p style=\"text-align: justify;\">A ARR, assim como a AIR, é uma ferramenta destinada a aperfeiçoar a ação regulatória, contribuindo para a efetividade, eficiência e eficácia da ação estatal.&nbsp;​Enquanto a AIR busca fundamentar as decisões no início ao ciclo regulatório, a ARR encerra o ciclo, com a avaliação dos resultados obtidos, dos impactos observados e recomendações sobre eventuais ajustes necessários.<\/p>"}, "f28bd29d-a8ab-4713-80dc-6c213db2760c": {"@type": "html", "html": "<p style=\"text-align: justify;\">Sua integração ao ciclo regulatório dos órgãos e entidades públicas federais, assim como a AIR, foi regulamentada pelo Decreto 10.411/2020, que dispõe que a cada primeiro ano de mandato presidencial eles deverão divulgar suas Agendas de ARR e implementá-las até o fim daquele mandato.<\/p>"}}, "blocks_layout": {"items": ["6c4d361e-bc64-4a85-81c6-43e8e08300a8", "7e89dbd3-f33b-4346-b2e8-656845f69ff3", "f28bd29d-a8ab-4713-80dc-6c213db2760c", "a8cfa086-99b3-460d-ba4c-ef73f45cd3eb", "483631cc-6eb5-4ca4-a9b2-85dbfc921047"]}}, "ab2fe74c-5c3e-4e42-beb8-602b53ee6d6a": {"blocks": {"3552598b-73f3-4aff-b89d-a74266e0ad61": {"@type": "html", "html": "<p style=\"text-align: justify;\">Essas atividades não são citadas na Portaria da Agenda Regulatória, e poderão ser atualizadas pelas Unidades Organizacionais da Agência a qualquer momento.<\/p>"}, "43ec679d-50f4-44ac-980f-7f36c9c67a24": {"@type": "html", "html": "<p style=\"text-align: justify;\">As<span class=\"fontColorThemeDarkAlt\"><span>&nbsp;demais atividades regulatórias realizadas&nbsp;<\/span><\/span>pela ANEEL também são realizadas em conjunto com a sociedade, que possui a oportunidade de contribuir para seu escopo em Tomadas de Subsídio e em Consultas e Audiências Públicas.<\/p>"}, "6d77cbe4-b075-4c08-b33e-a481c2bb5712": {"@type": "slate", "plaintext": "3 - Demais AtividadesRegulatórias", "value": [{"children": [{"text": "3 - Demais Atividades\nRegulatórias"}], "type": "h3"}]}, "a5baeee0-6fa2-4d5d-87b1-4a5070918c16": {"@type": "html", "html": "<p style=\"text-align: justify;\">Além da elaboração e revisão de normas não prioritárias, são atividades que visam à exploração de novos contextos e potenciais objetos regulatórios (como estudos, diagnósticos, por exemplo) para a melhor definição do escopo de novos normativos.<\/p>"}}, "blocks_layout": {"items": ["6d77cbe4-b075-4c08-b33e-a481c2bb5712", "43ec679d-50f4-44ac-980f-7f36c9c67a24", "a5baeee0-6fa2-4d5d-87b1-4a5070918c16", "3552598b-73f3-4aff-b89d-a74266e0ad61"]}}, "fbb1eb0c-fa30-46ab-b5ac-5a372e5effbe": {"blocks": {"011d339d-e527-456a-9322-9e112a68cfd5": {"@type": "html", "html": "<p style=\"text-align: justify;\"><span class=\"fontColorThemeDarkAlt\"><span>Análise de Impacto Regulatório - AIR<\/span><\/span><\/p>"}, "09d2b972-e0f4-4047-9181-c3840d8b6f91": {"@type": "html", "html": "<p style=\"text-align: justify;\">Entre as Atividades da Agenda Regulatória o Decreto nº 10.411/2020 instituiu a AIR, instrumento para avaliar a necessidade e as consequências de uma possível nova regulação, verificando benefícios potenciais, custos estimados e as alternativas para alcançar o objetivo da regulação. A AIR é, portanto, uma forma de auxilia o regulador a melhorar a qualidade de suas decisões.<\/p>"}, "19d28f42-7811-4ce7-ade6-7d956dfc45c7": {"@type": "html", "html": "<p style=\"text-align: justify;\">O processo de elaboração da Agenda Regulatória na ANEEL vem sendo aprimorado a cada ano, tendo como elemento essencial a participação de toda a sociedade.<\/p>"}, "2286da87-5120-4dcb-900d-c240114f038e": {"@type": "html", "html": "<p style=\"text-align: justify;\">Apresenta a relação de&nbsp;<span class=\"fontColorThemePrimary\"><span>atividades regulatórias prioritárias e&nbsp;<\/span><\/span><span class=\"fontColorThemeDarkAlt\"><span>que possuem previsão para edição de normativo durante o ciclo em andamento<\/span><\/span>. É instrumento de planejamento, gestão e participação pública e confere transparência e previsibilidade ao processo regulatório.<\/p>"}, "296dff41-343f-4df4-8b29-0eecbd75f3fd": {"@type": "slate", "plaintext": "1 - Agenda Regulatória (Lei nº 13.848/2019)", "value": [{"children": [{"text": "1 - Agenda Regulatória (Lei nº 13.848/2019)\n\n"}], "type": "h3"}]}, "aec7fc84-87b1-4e20-8b2b-ee5a0e933a35": {"@type": "html", "html": "<p style=\"text-align: justify;\">Trata-se de reconhecida boa prática institucional, tornando-se também obrigação legal nos termos da&nbsp;<a href=\"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2019/lei/l13848.htm\">Lei nº 13.848, de 25 de junho de 2019<\/a>, que dispõe sobre a gestão, a organização, o processo decisório e o controle social das Agências Reguladoras.<\/p>"}}, "blocks_layout": {"items": ["296dff41-343f-4df4-8b29-0eecbd75f3fd", "2286da87-5120-4dcb-900d-c240114f038e", "aec7fc84-87b1-4e20-8b2b-ee5a0e933a35", "19d28f42-7811-4ce7-ade6-7d956dfc45c7", "011d339d-e527-456a-9322-9e112a68cfd5", "09d2b972-e0f4-4047-9181-c3840d8b6f91"]}}}, "blocks_layout": {"items": ["fbb1eb0c-fa30-46ab-b5ac-5a372e5effbe", "96dd7dd2-25e8-4a9f-91d1-242040c84d9b", "ab2fe74c-5c3e-4e42-beb8-602b53ee6d6a"]}}, "gridCols": ["oneThird", "oneThird", "oneThird"], "gridSize": 12}}, "blocks_layout": {"items": ["aa2ad5b2-b676-4718-8f77-b92ee6332379", "a94f18fc-0618-49bf-9616-387d8a862067", "bb93820b-866c-4594-8082-40a574c2bdf9", "6b74f017-2ee5-4f5b-a91c-23e6a672f7d0", "e25b9ccd-0fea-4b73-a62f-6647ed80a12f", "f01161a5-e7fc-4d0c-a684-dbe09add65d9", "8fa83e73-d948-49ce-bc8e-01d3f73d303e", "818db20f-8543-4d7b-a916-1014599eb964"]}}}};</script>
