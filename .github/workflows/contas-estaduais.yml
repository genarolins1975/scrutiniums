name: Contas estaduais - contratos e captura
on:
  pull_request:
    paths:
      - 'pipeline/contas_estaduais/**'
      - 'public/contas-estaduais/**'
      - 'src/lib/contas-estaduais/**'
      - 'src/components/contas-estaduais/**'
      - 'src/app/contas-publicas-estaduais/**'
      - 'src/tests/contas-estaduais.test.ts'
      - '.github/workflows/contas-estaduais.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contratos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest pipeline.contas_estaduais.test_contratos pipeline.contas_estaduais.test_primarios pipeline.contas_estaduais.test_educacao pipeline.contas_estaduais.test_capturar_educacao pipeline.contas_estaduais.test_transporte -v
      - run: python3 -m pipeline.contas_estaduais.consolidar --check
  captura:
    needs: contratos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capturar encerramento de 2025 para as 27 UFs
        id: anual
        continue-on-error: true
        run: python3 -m pipeline.contas_estaduais.coletar --ano 2025 --ufs AC AL AM AP BA CE DF ES GO MA MG MS MT PA PB PE PI PR RJ RN RO RR RS SC SE SP TO --destino evidencia/anual
      - name: Capturar 2026 Q1 para conferir o snapshot herdado
        id: parcial
        continue-on-error: true
        run: python3 -m pipeline.contas_estaduais.coletar --ano 2026 --ufs AC AL AM AP BA CE DF ES GO MA MG MS MT PA PB PE PI PR RJ RN RO RR RS SC SE SP TO --quadrimestre 1 --somente-rgf --destino evidencia/parcial
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contas-estaduais-respostas-primarias
          path: evidencia/
          retention-days: 30
          if-no-files-found: error
      - name: Falhas de captura devem ficar visíveis
        if: steps.anual.outcome == 'failure' || steps.parcial.outcome == 'failure'
        run: exit 1
  educacao:
    needs: contratos
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capturar pacotes oficiais de educação de 2025
        run: python3 -m pipeline.contas_estaduais.capturar_educacao --destino evidencia/educacao
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contas-estaduais-educacao-fontes
          path: evidencia/educacao/
          retention-days: 30
          if-no-files-found: error
