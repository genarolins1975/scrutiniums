name: Atualizar dados do Gás Natural

# Domínio Gás Natural: recoleta as fontes (ANP, IBGE, BCB, Comex Stat, Banco Mundial),
# grava o seed versionado com o sha256 de cada original, reconstrói a gold em
# public/gas e publica só se os testes do pipeline passarem. A ANP atualiza a maior
# parte dos conjuntos até o último dia do mês seguinte ao de referência; a pesquisa de
# preços do botijão e do GNV fecha o mês na primeira quinzena. Separado dos outros
# domínios: falha de um não atrasa o outro.
on:
  schedule:
    - cron: "17 12 3,18 * *" # dias 3 e 18, 09:17 em São Paulo
  workflow_dispatch:
    inputs:
      sem_coleta:
        description: "Pular coleta e só reconstruir a gold a partir do seed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: atualizar-gas
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # a coleta da movimentação nos gasodutos baixa um arquivo diário por mês desde 2021 (cerca de 300 MB)
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar e reconstruir
        run: |
          if [ "${{ inputs.sem_coleta }}" = "true" ]; then
            python3 -m pipeline.gas.run
          else
            python3 -m pipeline.gas.run --coleta
          fi

      - name: Testes do pipeline
        id: testes
        continue-on-error: true
        run: python3 -m unittest pipeline.tests.test_gas -v

      - name: Reter publicação reprovada
        if: steps.testes.outcome == 'failure'
        run: |
          git checkout -- public/gas pipeline/gas/seed
          git clean -fdq public/gas pipeline/gas/seed
          echo "::error::testes reprovaram a gold do gás; publicação retida"
          exit 1

      - name: Commit e push
        if: steps.testes.outcome == 'success'
        run: |
          git config user.name "pipeline-observatorio[bot]"
          git config user.email "pipeline@scrutiniums.com"
          git add public/gas pipeline/gas/seed
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados do gás."
          else
            git commit -m "Atualiza dados do Gás Natural (pipeline automático)"
            for tentativa in 1 2 3 4; do
              git pull --rebase origin main && git push && exit 0
              sleep $((tentativa * 5))
            done
            echo "::error::não foi possível publicar após 4 tentativas"
            exit 1
          fi
