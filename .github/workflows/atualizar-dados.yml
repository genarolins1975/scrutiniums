name: Atualizar dados do Observatório

# Roda o pipeline (BCB, IBGE, Ipeadata, IF.data, CNJ, Open Finance...),
# reconstrói a camada gold e publica em public/obs/data. O push dispara
# o deploy automático na Vercel.
#
# Custo da PGFN: a dívida ativa é trimestral e o coletor só baixa quando aparece
# trimestre novo (idempotente por trimestre+conjunto no silver, que vem do cache
# abaixo). Nos dias comuns custa uma requisição ao índice. Quando o trimestre vira
# — ou quando o cache expira —, são ~1,4 GB e cerca de 7 minutos, dentro do
# timeout de 90. Nada disso vai para o disco: o ZIP é descomprimido em fluxo.
on:
  schedule:
    - cron: "0 9 * * *" # 06:00 em São Paulo, diariamente
  workflow_dispatch:
    inputs:
      somente_gold:
        description: "Pular coleta e só reconstruir o gold do estado atual"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write # poda dos caches antigos do estado do pipeline

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # 300 min: orçamento de coleta de 120 min (pipeline/run.py) + gold + publicação, com folga.
    # Em 08/09/2026 o teto de 150 min cancelou a coleta antes do gold e nada foi publicado.
    timeout-minutes: 300
    outputs:
      retida: ${{ steps.reter.outputs.retida }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências do pipeline
        # pypdf: extração de texto dos releases de resultados (Fase 2). O
        # restante do pipeline segue só com a biblioteca padrão. pyarrow: as suítes
        # Python do portão de publicação importam os módulos de energia (69 testes
        # quebram sem ele); o ci.yml já o instala.
        run: pip install pypdf -r pipeline/energia/requirements.txt

      # restore/save separados de propósito: com actions/cache@v4 o salvamento
      # acontece no post-job, que NÃO roda quando o job estoura o tempo ou é
      # cancelado. Foi assim que a falha de 03/08 virou uma sequência de
      # timeouts: sem cache salvo, cada execução seguinte tinha mais trabalho a
      # refazer do que a anterior. Com `if: always()`, o progresso da coleta é
      # preservado mesmo quando a execução não termina.
      - name: Restaurar estado do pipeline (silver e bronze)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/silver
            data/bronze
          key: pipeline-estado-${{ github.run_id }}
          restore-keys: |
            pipeline-estado-

      # O cache do repositório tem limite de 10 GB e o estado do Setor Elétrico ocupa
      # ~7,2 GB por cópia (15/10/2026): quando a energia grava a cópia nova, o total passa
      # do limite e o estado do crédito é despejado (03/10 e 15/10/2026). A release
      # pipeline-estado não conta para o limite (scripts/estado_duravel.sh).
      - name: Restaurar estado da cópia durável (cache ausente)
        id: duravel
        if: steps.cache.outputs.cache-matched-key == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/estado_duravel.sh restaurar

      - name: Semear histórico na primeira execução
        run: |
          mkdir -p data/silver data/bronze data/gold
          if [ ! -f data/silver/observatorio.db ]; then
            echo "Cache vazio: semeando o histórico acumulado."
            gunzip -kc pipeline/seed/silver-seed.db.gz > data/silver/observatorio.db
          else
            echo "Estado restaurado do cache."
          fi

      - name: Executar pipeline
        id: pipeline
        run: |
          # -u: sem buffer, para o log mostrar onde a coleta está quando o job é cancelado
          if [ "${{ inputs.somente_gold }}" = "true" ]; then
            python3 -u pipeline/run.py --skip-fetch
          else
            python3 -u pipeline/run.py
          fi

      - name: Guardar estado do pipeline
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/silver
            data/bronze
          key: pipeline-estado-${{ github.run_id }}

      # Só o main publica a cópia: a release não tem separação por ramo, e uma execução
      # manual num ramo de PR não pode substituir o estado que o main restaura.
      - name: Cópia durável do estado (release pipeline-estado)
        if: steps.pipeline.outcome == 'success' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/estado_duravel.sh salvar

      # Em 03/10 e 15/10/2026 a restauração não achou nenhum cache (Cache not found) e o
      # silver foi semeado de novo: o despejo veio do estado da energia (~7,2 GB por cópia)
      # contra o limite de 10 GB do repositório. A proteção é a cópia durável acima, e a
      # energia passou a apagar a cópia anterior antes de gravar a nova. Com a cópia
      # durável, basta guardar a mais recente do ramo (~0,9 GB). Falha aqui não bloqueia.
      - name: Podar caches antigos do estado
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/podar_cache.sh pipeline-estado- 1

      # A lição de 08/08: build quebrado publica stub de erro e o workflow
      # termina VERDE — painel fora do ar sem nenhum vigia acusar. O sentinela
      # compara o build novo com a última publicação; em regressão (íntegro →
      # stub, ou arquivo não gerado), mantém a publicação anterior no ar e o
      # passo seguinte abre issue. Degradação já publicada não re-acusa.
      - name: Sentinela de regressão do gold
        id: sanidade
        run: python3 scripts/sanidade_gold.py

      - name: Alertar regressão de gold
        if: steps.sanidade.outputs.regressoes != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REGS: ${{ steps.sanidade.outputs.regressoes }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITULO="Gold regrediu para stub de erro — painel mantido com a última publicação"
          CORPO="Execução de $(date -u +%d/%m/%Y\ %H:%M) UTC: ${RUN_URL}

          Builds que regrediram (o site segue servindo a última versão íntegra):
          ${REGS}

          O log do passo *Executar pipeline* mostra o erro de cada builder e as
          falhas por coletor. Enquanto esta issue estiver aberta, novas
          ocorrências viram comentários aqui."
          EXISTENTE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITULO\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTENTE" ]; then
            gh issue comment "$EXISTENTE" --repo "$GITHUB_REPOSITORY" \
              --body "Nova ocorrência: ${REGS} — ${RUN_URL}"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITULO" --body "$CORPO"
          fi

      # Até 24/09/2026 os testes só rodavam DEPOIS do push: número errado ia ao ar.
      # Continuam antes do commit. Desde 18/10, cada grupo tem decisão própria;
      # a composição final (inclusive UFs reconstruídas com fontes retidas) é retestada.
      - name: Node para os testes de conteúdo
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # As três suítes continuam completas, mesmo quando uma reprova: em 13/10/2026
      # bash -e impediu as suítes Python de rodar depois do vitest. O orquestrador
      # registra cada teste e captura cada código, sem interromper as outras suítes.
      # Em 16/10, ENOBUFS abortou o vitest e a issue culpou Python indevidamente;
      # em 17/10 o Chromium não carregou. Agora esses casos são INCONCLUSIVOS:
      # uma repetição da suíte; reincidência bloqueia todos os grupos, com log.
      - name: Publicar gold no site — testes completos e seleção antes do commit
        id: testes
        continue-on-error: true
        run: |
          set +e
          python3 scripts/validar_publicar_gold.py
          RESULTADO=$?
          # Compatibilidade: códigos reais e logs permanecem disponíveis ao relatório
          # anterior. A decisão usa resultado.json, não interpreta texto do terminal.
          python3 scripts/testes_reprovados.py --suite vitest
          V=$?
          python3 scripts/testes_reprovados.py --suite pipeline 2>&1 | tee pipeline-testes.log
          P=${PIPESTATUS[0]}
          python3 scripts/testes_reprovados.py --suite pesquisa 2>&1 | tee pesquisa-testes.log
          Q=${PIPESTATUS[0]}
          echo "vitest=$V pipeline=$P pesquisa=$Q" | tee testes-codigos.txt
          if [ "$RESULTADO" -le 1 ] && [ -f .gold-publicacao/resultado.json ]; then
            echo "publicacao_segura=1" >> "$GITHUB_OUTPUT"
          fi
          exit "$RESULTADO"

      - name: Reter publicação reprovada — relatório dos grupos
        id: reter
        if: steps.testes.outcome == 'failure' && steps.testes.outputs.publicacao_segura == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Não desfaz os grupos aprovados: os retidos já mantêm os bytes da base.
          echo "retida=1" >> "$GITHUB_OUTPUT"
          python3 scripts/testes_reprovados.py --publicacao .gold-publicacao/resultado.json > .gold-publicacao/relatorio.md
          # O relatório anterior segue como diagnóstico adicional (incidente 16/10).
          python3 scripts/testes_reprovados.py vitest-resultado.json testes-codigos.txt pipeline-testes.log pesquisa-testes.log > .gold-publicacao/diagnostico-legado.md
          python3 - <<'PYBODY'
          import os
          from pathlib import Path
          texto = Path('.gold-publicacao/relatorio.md').read_text()
          texto = texto[:55000] + ('\n\nRelatório completo no artefato gold-publicacao.' if len(texto) > 55000 else '')
          Path('.gold-publicacao/issue.md').write_text('Execução: ' + os.environ['RUN_URL'] + '\n\n' + texto)
          PYBODY
          TITULO="Testes de conteúdo reprovaram a gold do dia: publicação retida"
          EXISTENTE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITULO\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTENTE" ]; then
            gh issue comment "$EXISTENTE" --repo "$GITHUB_REPOSITORY" --body-file .gold-publicacao/issue.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITULO" --body-file .gold-publicacao/issue.md \
              --assignee "$GITHUB_REPOSITORY_OWNER"
          fi

      - name: Guardar decisões, mapa de testes e logs de todas as tentativas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-publicacao
          include-hidden-files: true
          path: |
            .gold-publicacao/
            vitest-resultado.json
            testes-codigos.txt
            pipeline-testes.log
            pesquisa-testes.log
          retention-days: 30

      - name: Commit e push das atualizações
        if: always() && steps.testes.outputs.publicacao_segura == '1'
        run: |
          git config user.name "pipeline-observatorio[bot]"
          git config user.email "pipeline@scrutiniums.com"
          BASE_GOLD=$(git rev-parse HEAD:public/obs/data/gold)
          git add public/obs/data
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados publicados."
          else
            git commit -m "Atualiza dados do Observatório (pipeline automático)"
            # a execução leva mais de uma hora: é normal que main tenha andado
            # nesse intervalo. Sem o rebase, o push é rejeitado e o dia inteiro
            # de coleta se perde — foi o que aconteceu em 03/08.
            # rebase e push no MESMO ramo que disparou a execução (main no agendamento;
            # o ramo do PR no disparo manual de validação)
            for tentativa in 1 2 3 4; do
              if git fetch origin "$GITHUB_REF_NAME"; then
                # A composição foi testada com esta base. Rebase sobre outra gold
                # poderia trocar uma fonte retida sem reconstruir UFs: não publicar.
                if [ "$(git rev-parse FETCH_HEAD:public/obs/data/gold)" != "$BASE_GOLD" ]; then
                  echo "::error::a gold publicada mudou durante a execução; repetir o ciclo sobre a nova base antes de publicar"
                  exit 1
                fi
                git rebase FETCH_HEAD && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
              fi
              echo "push falhou (tentativa $tentativa); nova tentativa em $((tentativa * 5))s"
              sleep $((tentativa * 5))
            done
            echo "::error::não foi possível publicar os dados após 4 tentativas"
            exit 1
          fi

      # Retenção deixa a execução VERMELHA. De 25/09 a 12/10/2026 todas as execuções
      # retidas terminaram verdes (o passo de testes tem continue-on-error), e a aba
      # Actions mostrou 18 dias de sucesso com o gold parado. A issue já foi aberta ou
      # comentada no passo anterior; o job `alertar` não duplica.
      - name: Sinalizar publicação retida
        if: always() && steps.testes.outcome == 'failure'
        run: |
          echo "::error::há retenção, falha de infraestrutura ou teste sem gold reprovado; ver o relatório e a issue 'Testes de conteúdo reprovaram a gold do dia'"
          exit 1

  # A falha de 03-06/08 ficou quatro dias invisível: o pipeline morria em
  # silêncio e o gold envelhecia sem ninguém saber, até uma checagem manual.
  # Este job transforma qualquer término anormal em issue aberta no repositório
  # — visível, com link para o run, e sem duplicar enquanto a anterior estiver
  # aberta (o comentário acumula as ocorrências no mesmo lugar).
  alertar:
    runs-on: ubuntu-latest
    needs: pipeline
    if: always() && needs.pipeline.outputs.retida != '1' && (needs.pipeline.result == 'failure' || needs.pipeline.result == 'cancelled')
    timeout-minutes: 5
    steps:
      - name: Abrir ou comentar issue de falha
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADO: ${{ needs.pipeline.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITULO="Pipeline diário interrompido — dados do Observatório podem estar defasados"
          CORPO="Execução de $(date -u +%d/%m/%Y\ %H:%M) UTC terminou com **${RESULTADO}**: ${RUN_URL}

          O que verificar, na ordem em que as falhas anteriores aconteceram:
          1. push rejeitado por main ter andado durante a execução (o retry com rebase deveria cobrir);
          2. timeout — se repetir com 150 min, o problema é volume de coleta, não transiente;
          3. fonte fora do ar (o log do passo *Executar pipeline* lista as falhas por coletor).

          Enquanto esta issue estiver aberta, novas falhas viram comentários aqui."
          EXISTENTE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITULO\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTENTE" ]; then
            gh issue comment "$EXISTENTE" --repo "$GITHUB_REPOSITORY" \
              --body "Nova ocorrência (**${RESULTADO}**): ${RUN_URL}"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITULO" --body "$CORPO"
          fi
