name: Atualizar dados da Educação nos municípios

# Observatório dos Serviços Públicos, painel Educação nos municípios: recoleta das três fontes e publicação pelo motor
# comum por grupo (scripts/atualizacao_por_grupo.py, config/atualizacao/educacao.json). A gold
# (public/educacao/gold/educacao.json e um arquivo por UF em public/educacao/gold/municipios) é reconstruída dos seeds e
# só é publicada com os testes verdes: planilhas conferidas com o MD5 publicado pelo INEP, cada Ideb fechando com N × P,
# municípios com Ideb na contagem da nota informativa, 27 UFs e o Brasil presentes, Censo Escolar somando municípios,
# UFs e Brasil com as redes fechando, população somando a do Brasil, nenhuma rede com Ideb sem matrícula e nenhum Ideb
# publicado revisto ou sumido. Reprovado, a publicação anterior continua no ar, a issue é aberta ou comentada e a
# execução fica vermelha.
#
# Cadência pela fonte: o Ideb é bienal (o de 2025 saiu em 05/08/2026; o INEP avisou na nota informativa que foi a última
# divulgação com a fórmula original) e a Sinopse do Censo Escolar é anual (a de 2025 foi gravada em 30/07/2026). Uma
# execução por mês, no dia 9, alcança as duas publicações em até um mês; dado igual não gera commit (o sinal é o
# hash_dados da gold).
on:
  schedule:
    - cron: "23 11 9 * *" # dia 9 de cada mês, 08:23 em São Paulo
  workflow_dispatch:
    inputs:
      sem_coleta:
        description: "Pular a coleta e só reconstruir a gold a partir dos seeds (publica se mudou e os testes passarem)"
        type: boolean
        default: false
      grupos:
        description: "Coletar só estes grupos (ids separados por vírgula; vazio = todos)"
        type: string
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: atualizar-educacao
  cancel-in-progress: false

env:
  CONFIG: config/atualizacao/educacao.json
  TITULO_ISSUE: "Atualização agendada da Educação nos municípios: publicação retida ou coleta com falha"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # duas planilhas do Ideb por município (cerca de 25 MB cada), as de UF e Brasil, a Sinopse do Censo Escolar (cerca de
    # 230 MB) e a população do SIDRA; cada comando tem teto próprio na configuração
    timeout-minutes: 90
    outputs:
      relatado: ${{ steps.issue.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # a coleta, a gold e os testes usam só a biblioteca padrão (as planilhas .xlsx do INEP são lidas pelo leitor mínimo
      # de pipeline/eficiencia/fontes/xlsx.py; o intermediário TLS do INEP vem versionado em pipeline/contas_estaduais)

      - name: Node para os testes de contrato
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Dependências da interface
        run: npm ci

      - name: Coletar, reconstruir e decidir a publicação por grupo
        id: ciclo
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SEM_COLETA: ${{ inputs.sem_coleta }}
          GRUPOS: ${{ inputs.grupos }}
        run: |
          ARGS=()
          if [ "$SEM_COLETA" = "true" ]; then ARGS+=(--sem-coleta); fi
          if [ -n "$GRUPOS" ]; then ARGS+=(--grupos "$GRUPOS"); fi
          python3 -u scripts/atualizacao_por_grupo.py ciclo "$CONFIG" "${ARGS[@]}"

      # Só os grupos aprovados e a gold, com rebase sobre o ramo e quatro tentativas. Se a gold ou os seeds da
      # educação mudaram no ramo durante a execução, não publica (a composição foi testada sobre outra base); se o
      # código mudou, reconstrói e testa com o código novo antes de empurrar.
      - name: Commit e push dos grupos aprovados
        id: publicar
        if: always() && steps.ciclo.outputs.publicavel == '1'
        run: |
          git config user.name "pipeline-observatorio[bot]"
          git config user.email "pipeline@scrutiniums.com"
          python3 -u scripts/atualizacao_por_grupo.py publicar "$CONFIG" --ramo "$GITHUB_REF_NAME"

      - name: Abrir ou comentar a issue de retenção
        id: issue
        if: always() && (steps.ciclo.outcome != 'success' || steps.publicar.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUBLICACAO: ${{ steps.publicar.outcome }}
        run: |
          CORPO=.atualizacao/educacao/relatorio.md
          mkdir -p .atualizacao/educacao
          if [ ! -s "$CORPO" ]; then
            printf 'Execução: %s\n\nO ciclo terminou sem relatório (falha antes de gravar). Ver o log do passo *Coletar, reconstruir e decidir*.\n' "$RUN_URL" > "$CORPO"
          fi
          if [ "$PUBLICACAO" = "failure" ]; then
            printf '\n**A publicação dos grupos aprovados falhou** (passo *Commit e push*): nada foi empurrado.\n' >> "$CORPO"
          fi
          scripts/issue_dedup.sh "$TITULO_ISSUE" "$CORPO"

      - name: Guardar resultado, relatório e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atualizacao-educacao
          include-hidden-files: true
          path: .atualizacao/educacao/
          if-no-files-found: warn
          retention-days: 30

      # Retenção deixa a execução VERMELHA: de 25/09 a 12/10/2026 o Crédito reteve a gold com o
      # workflow verde e ninguém viu (OPERACOES.md, terceira memória).
      - name: Sinalizar publicação retida
        if: always() && (steps.ciclo.outcome != 'success' || steps.publicar.outcome == 'failure')
        run: |
          echo "::error::grupo retido, coleta com falha ou publicação não concluída; ver a issue '$TITULO_ISSUE'"
          exit 1

  # Tempo esgotado ou cancelamento não chegam ao passo da issue: este job cobre esses casos.
  alertar:
    runs-on: ubuntu-latest
    needs: pipeline
    if: always() && needs.pipeline.outputs.relatado != 'true' && (needs.pipeline.result == 'failure' || needs.pipeline.result == 'cancelled')
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Abrir ou comentar issue de interrupção
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADO: ${{ needs.pipeline.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'Execução de %s UTC terminou com **%s** antes do relatório (tempo esgotado, cancelamento ou falha de preparo): %s\n\nNada foi publicado.\n' \
            "$(date -u +%d/%m/%Y\ %H:%M)" "$RESULTADO" "$RUN_URL" > /tmp/corpo.md
          scripts/issue_dedup.sh "$TITULO_ISSUE" /tmp/corpo.md
