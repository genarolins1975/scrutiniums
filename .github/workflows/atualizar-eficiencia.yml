name: Atualizar dados da Eficiência Estatal

# Eficiência Estatal (OBEE), Educação e Saúde nas capitais: recoleta mensal do Siconfi (DCA I-E,
# RREO 02 do 6º bimestre, MSC de dezembro) e do SIOPS para os exercícios integrados (2021 a 2025),
# e publicação por grupo (scripts/atualizacao_por_grupo.py, config/atualizacao/eficiencia.json).
# Os entes entregam a DCA até 30 de abril e retificam a qualquer tempo: a recoleta mensal capta a
# retificação. Mudança só de data de captura não publica nada (o sinal é o hash_dados de cada gold).
# Consulta que volta com erro no lugar de uma resposta íntegra reprova a coleta do grupo (guarda
# manifesto_sem_erro_novo): fonte em pane não troca dado publicado por ausência.
#
# A gold da Saúde é fixada por hash no resumo do atlas (src/lib/eficiencia/panorama-atlas.json) e na
# referência do piloto (docs/obee/resultados/piloto-2022.json), congelada por decisão. Mudança real
# na Saúde é retida pelos testes até a regeneração revisada desses derivados; a issue diz quais.
#
# Fica de fora, por ser integração manual por decisão (OPERACOES.md): exercício novo (ANOS_FINANCEIROS),
# pacotes do INEP (baixados à mão, até 540 MB cada), CNES, Relatório APS, RIPSA, OCDE, SIOPE e os
# demais capítulos do OBEE, todos fixados por edição com revisão.
on:
  schedule:
    - cron: "53 10 12 * *" # dia 12, 07:53 em São Paulo
  workflow_dispatch:
    inputs:
      sem_coleta:
        description: "Pular a coleta e só reconstruir as golds a partir do seed (publica se mudou e os testes passarem)"
        type: boolean
        default: false
      grupos:
        description: "Coletar só estes grupos (ids separados por vírgula; vazio = todos)"
        type: string
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: atualizar-eficiencia
  cancel-in-progress: false

env:
  CONFIG: config/atualizacao/eficiencia.json
  TITULO_ISSUE: "Atualização agendada da Eficiência Estatal: publicação retida ou coleta com falha"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # cerca de 1.100 consultas ao Siconfi e ao SIOPS com pausa entre elas; cada comando tem teto
    # próprio na configuração.
    timeout-minutes: 240
    outputs:
      relatado: ${{ steps.issue.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node para os testes de contrato
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Dependências da interface
        run: npm ci

      - name: Coletar, reconstruir e decidir a publicação por grupo
        id: ciclo
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SEM_COLETA: ${{ inputs.sem_coleta }}
          GRUPOS: ${{ inputs.grupos }}
        run: |
          ARGS=()
          if [ "$SEM_COLETA" = "true" ]; then ARGS+=(--sem-coleta); fi
          if [ -n "$GRUPOS" ]; then ARGS+=(--grupos "$GRUPOS"); fi
          python3 -u scripts/atualizacao_por_grupo.py ciclo "$CONFIG" "${ARGS[@]}"

      # Só os grupos aprovados e as golds, com rebase sobre o ramo e quatro tentativas. Se a gold ou o
      # seed do OBEE mudaram no ramo durante a execução, não publica (a composição foi testada
      # sobre outra base); se o código mudou, reconstrói e testa com o código novo antes de empurrar.
      - name: Commit e push dos grupos aprovados
        id: publicar
        if: always() && steps.ciclo.outputs.publicavel == '1'
        run: |
          git config user.name "pipeline-observatorio[bot]"
          git config user.email "pipeline@scrutiniums.com"
          python3 -u scripts/atualizacao_por_grupo.py publicar "$CONFIG" --ramo "$GITHUB_REF_NAME"

      - name: Abrir ou comentar a issue de retenção
        id: issue
        if: always() && (steps.ciclo.outcome != 'success' || steps.publicar.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUBLICACAO: ${{ steps.publicar.outcome }}
        run: |
          CORPO=.atualizacao/eficiencia/relatorio.md
          mkdir -p .atualizacao/eficiencia
          if [ ! -s "$CORPO" ]; then
            printf 'Execução: %s\n\nO ciclo terminou sem relatório (falha antes de gravar). Ver o log do passo *Coletar, reconstruir e decidir*.\n' "$RUN_URL" > "$CORPO"
          fi
          if [ "$PUBLICACAO" = "failure" ]; then
            printf '\n**A publicação dos grupos aprovados falhou** (passo *Commit e push*): nada foi empurrado.\n' >> "$CORPO"
          fi
          scripts/issue_dedup.sh "$TITULO_ISSUE" "$CORPO"

      - name: Guardar resultado, relatório e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atualizacao-eficiencia
          include-hidden-files: true
          path: .atualizacao/eficiencia/
          if-no-files-found: warn
          retention-days: 30

      # Retenção deixa a execução VERMELHA: de 25/09 a 12/10/2026 o Crédito reteve a gold com o
      # workflow verde e ninguém viu (OPERACOES.md, terceira memória).
      - name: Sinalizar publicação retida
        if: always() && (steps.ciclo.outcome != 'success' || steps.publicar.outcome == 'failure')
        run: |
          echo "::error::grupo retido, coleta com falha ou publicação não concluída; ver a issue '$TITULO_ISSUE'"
          exit 1

  # Tempo esgotado ou cancelamento não chegam ao passo da issue: este job cobre esses casos.
  alertar:
    runs-on: ubuntu-latest
    needs: pipeline
    if: always() && needs.pipeline.outputs.relatado != 'true' && (needs.pipeline.result == 'failure' || needs.pipeline.result == 'cancelled')
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Abrir ou comentar issue de interrupção
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADO: ${{ needs.pipeline.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'Execução de %s UTC terminou com **%s** antes do relatório (tempo esgotado, cancelamento ou falha de preparo): %s\n\nNada foi publicado.\n' \
            "$(date -u +%d/%m/%Y\ %H:%M)" "$RESULTADO" "$RUN_URL" > /tmp/corpo.md
          scripts/issue_dedup.sh "$TITULO_ISSUE" /tmp/corpo.md
