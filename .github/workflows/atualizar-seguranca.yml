name: Atualizar dados da Segurança pública

# Eficiência Estatal, painel Segurança pública por UF: recoleta das quatro fontes e publicação pelo motor comum
# por grupo (scripts/atualizacao_por_grupo.py, config/atualizacao/seguranca.json). A gold
# (public/eficiencia/seguranca-publica/gold/seguranca.json) e o CSV de taxas por UF são reconstruídos dos seeds e só
# são publicados com os testes verdes: 27 UFs e todos os anos presentes, eventos do Sinesp com o nome esperado,
# totais nas faixas plausíveis, revisão de ano fechado de até 10%, total do TabNet igual à soma das UFs e população
# das UFs igual à do Brasil. Reprovado, a publicação anterior continua no ar, a issue é aberta ou comentada e a
# execução fica vermelha.
#
# Cadência pela fonte: o MJSP atualiza as planilhas do Sinesp VDE ao longo do ano (o ano corrente é parcial e só
# entra na gold quando fecha); o SIM troca o ano preliminar pelo final uma vez por ano; as DCAs dos estados chegam
# até 30 de abril e são retificáveis; a Projeção do IBGE muda a cada revisão. Uma coleta mensal cobre as quatro;
# dado igual não gera commit (o sinal é o hash_dados da gold).
on:
  schedule:
    - cron: "37 12 21 * *" # dia 21, 09:37 em São Paulo
  workflow_dispatch:
    inputs:
      sem_coleta:
        description: "Pular a coleta e só reconstruir a gold a partir do seed (publica se mudou e os testes passarem)"
        type: boolean
        default: false
      grupos:
        description: "Coletar só estes grupos (ids separados por vírgula; vazio = todos)"
        type: string
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: atualizar-seguranca
  cancel-in-progress: false

env:
  CONFIG: config/atualizacao/seguranca.json
  TITULO_ISSUE: "Atualização agendada da Segurança pública: publicação retida ou coleta com falha"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # doze planilhas do Sinesp (cerca de 25 MB cada), quatro consultas ao TabNet, cerca de 300 consultas ao Siconfi e
    # uma planilha do IBGE; cada comando tem teto próprio na configuração
    timeout-minutes: 180
    outputs:
      relatado: ${{ steps.issue.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # openpyxl: planilhas do Sinesp VDE e da Projeção do IBGE (só os coletores; a gold usa a biblioteca padrão)
      - name: Dependências da coleta
        run: pip install openpyxl

      - name: Node para os testes de contrato
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Dependências da interface
        run: npm ci

      - name: Coletar, reconstruir e decidir a publicação por grupo
        id: ciclo
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SEM_COLETA: ${{ inputs.sem_coleta }}
          GRUPOS: ${{ inputs.grupos }}
        run: |
          ARGS=()
          if [ "$SEM_COLETA" = "true" ]; then ARGS+=(--sem-coleta); fi
          if [ -n "$GRUPOS" ]; then ARGS+=(--grupos "$GRUPOS"); fi
          python3 -u scripts/atualizacao_por_grupo.py ciclo "$CONFIG" "${ARGS[@]}"

      # Só os grupos aprovados e a gold, com rebase sobre o ramo e quatro tentativas. Se a gold ou os
      # seeds da segurança mudaram no ramo durante a execução, não publica (a composição foi testada
      # sobre outra base); se o código mudou, reconstrói e testa com o código novo antes de empurrar.
      - name: Commit e push dos grupos aprovados
        id: publicar
        if: always() && steps.ciclo.outputs.publicavel == '1'
        run: |
          git config user.name "pipeline-observatorio[bot]"
          git config user.email "pipeline@scrutiniums.com"
          python3 -u scripts/atualizacao_por_grupo.py publicar "$CONFIG" --ramo "$GITHUB_REF_NAME"

      - name: Abrir ou comentar a issue de retenção
        id: issue
        if: always() && (steps.ciclo.outcome != 'success' || steps.publicar.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUBLICACAO: ${{ steps.publicar.outcome }}
        run: |
          CORPO=.atualizacao/seguranca/relatorio.md
          mkdir -p .atualizacao/seguranca
          if [ ! -s "$CORPO" ]; then
            printf 'Execução: %s\n\nO ciclo terminou sem relatório (falha antes de gravar). Ver o log do passo *Coletar, reconstruir e decidir*.\n' "$RUN_URL" > "$CORPO"
          fi
          if [ "$PUBLICACAO" = "failure" ]; then
            printf '\n**A publicação dos grupos aprovados falhou** (passo *Commit e push*): nada foi empurrado.\n' >> "$CORPO"
          fi
          scripts/issue_dedup.sh "$TITULO_ISSUE" "$CORPO"

      - name: Guardar resultado, relatório e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atualizacao-seguranca
          include-hidden-files: true
          path: .atualizacao/seguranca/
          if-no-files-found: warn
          retention-days: 30

      # Retenção deixa a execução VERMELHA: de 25/09 a 12/10/2026 o Crédito reteve a gold com o
      # workflow verde e ninguém viu (OPERACOES.md, terceira memória).
      - name: Sinalizar publicação retida
        if: always() && (steps.ciclo.outcome != 'success' || steps.publicar.outcome == 'failure')
        run: |
          echo "::error::grupo retido, coleta com falha ou publicação não concluída; ver a issue '$TITULO_ISSUE'"
          exit 1

  # Tempo esgotado ou cancelamento não chegam ao passo da issue: este job cobre esses casos.
  alertar:
    runs-on: ubuntu-latest
    needs: pipeline
    if: always() && needs.pipeline.outputs.relatado != 'true' && (needs.pipeline.result == 'failure' || needs.pipeline.result == 'cancelled')
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Abrir ou comentar issue de interrupção
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADO: ${{ needs.pipeline.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'Execução de %s UTC terminou com **%s** antes do relatório (tempo esgotado, cancelamento ou falha de preparo): %s\n\nNada foi publicado.\n' \
            "$(date -u +%d/%m/%Y\ %H:%M)" "$RESULTADO" "$RUN_URL" > /tmp/corpo.md
          scripts/issue_dedup.sh "$TITULO_ISSUE" /tmp/corpo.md
