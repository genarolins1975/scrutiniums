name: Alertas de atualização por e-mail

# Verificação diária dos alertas que as contas assinam em "Avisar quando atualizar"
# (src/app/api/alertas/enviar). A rota lê a data de referência que cada fonte publica
# neste deploy e avisa só as assinaturas cuja referência avançou; sem dado novo, nada
# sai. Idempotente: a reserva grava a referência avisada antes do envio, então um
# disparo manual no mesmo dia não repete aviso. Cada execução autorizada fica
# registrada; sem ela nos últimos três dias, a conta diz que o envio não está ligado.
on:
  schedule:
    - cron: "37 11 * * *" # 08:37 em São Paulo, depois das publicações noturnas e matinais
  workflow_dispatch:
    inputs:
      simular:
        description: "Validar referências e conteúdo sem enviar nem registrar verificação real"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: alertas-atualizacao
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Disparar verificação dos alertas
        env:
          BOLETIM_SECRET: ${{ secrets.BOLETIM_SECRET }}
          SIMULAR: ${{ github.event_name == 'workflow_dispatch' && inputs.simular || false }}
        run: |
          if [ "${#BOLETIM_SECRET}" -lt 16 ]; then
            echo "::error::BOLETIM_SECRET ausente ou com menos de 16 caracteres no GitHub Actions; o mesmo valor precisa estar na Vercel (OPERACOES.md)"
            exit 1
          fi
          DESTINO="https://scrutiniums.com/api/alertas/enviar"
          METODO=POST
          if [ "$SIMULAR" = "true" ]; then DESTINO="${DESTINO}?simular=1"; METODO=GET; fi
          curl -sS --fail-with-body --connect-timeout 15 --max-time 310 -X "$METODO" \
            "$DESTINO" \
            -H "Authorization: Bearer ${BOLETIM_SECRET}"
