name: Atualizar dados do Território e Clima

# Observatório do Território e Clima: recoleta os focos de calor do satélite de
# referência e a área queimada do INPE (servidor de dados abertos COIDS), grava o
# seed com o sha256 de cada original, reconstrói a gold em public/territorio e
# publica só se os testes do pipeline passarem. O arquivo mensal do INPE fecha o mês
# nos primeiros dias do mês seguinte e o do mês em curso muda todo dia; duas
# execuções por mês bastam para os meses completos. Separado dos outros domínios:
# falha de um não atrasa o outro.
on:
  schedule:
    - cron: "41 11 2,16 * *" # dias 2 e 16, 08:41 em São Paulo
  workflow_dispatch:
    inputs:
      sem_coleta:
        description: "Pular coleta e só reconstruir a gold a partir do seed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: atualizar-territorio
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # o ano corrente exige os arquivos mensais de todos os satélites (centenas de MB nos meses de pico)
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar e reconstruir
        run: |
          if [ "${{ inputs.sem_coleta }}" = "true" ]; then
            python3 -m pipeline.territorio.run
          else
            python3 -m pipeline.territorio.run --coleta
          fi

      - name: Testes do pipeline
        id: testes
        continue-on-error: true
        run: python3 -m unittest pipeline.tests.test_territorio -v

      - name: Reter publicação reprovada
        if: steps.testes.outcome == 'failure'
        run: |
          git checkout -- public/territorio pipeline/territorio/seed
          git clean -fdq public/territorio pipeline/territorio/seed
          echo "::error::testes reprovaram a gold do Território e Clima; publicação retida"
          exit 1

      - name: Commit e push
        if: steps.testes.outcome == 'success'
        run: |
          git config user.name "pipeline-observatorio[bot]"
          git config user.email "pipeline@scrutiniums.com"
          git add public/territorio pipeline/territorio/seed
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados do Território e Clima."
            exit 0
          fi
          git commit -m "Atualiza dados do Território e Clima (pipeline automático)"
          for tentativa in 1 2 3 4; do
            git fetch origin main
            # se o main avançou durante a coleta, a gold é refeita a partir do seed já capturado, com o código novo,
            # e só segue com os testes verdes: nunca se publica gold gerada por código antigo
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::conflito ao trazer o main; publicação retida"
              exit 1
            fi
            python3 -m pipeline.territorio.run
            python3 -m unittest pipeline.tests.test_territorio
            git add public/territorio pipeline/territorio/seed
            git diff --cached --quiet || git commit --amend --no-edit
            git push origin HEAD:main && exit 0
            sleep $((tentativa * 5))
          done
          echo "::error::não foi possível publicar após 4 tentativas"
          exit 1
