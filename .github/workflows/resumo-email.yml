name: Resumo do crédito por e-mail

# Envia o resumo às assinaturas confirmadas (src/app/api/resumo/enviar). A rota é
# idempotente: a assinatura diária só recebe edição nova (gerado_em diferente do
# último envio) e a semanal sai uma vez, às segundas-feiras. Por isso o disparo
# pode acontecer depois de cada execução do pipeline e numa reserva diária.
on:
  workflow_run:
    workflows: ["Atualizar dados do Observatório"]
    types: [completed]
  schedule:
    - cron: "47 21 * * *" # reserva diária, 18:47 em São Paulo
  workflow_dispatch:
    inputs:
      simular:
        description: "Validar conteúdo e destinatários sem enviar nem reservar mensagens"
        type: boolean
        default: true

permissions:
  contents: read

# um disparo por vez; a rota também reserva cada envio de forma atômica
concurrency:
  group: resumo-email
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # até oito lotes de 310 s, espera de deploy e preparação
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /scripts/disparar_resumo.py
          sparse-checkout-cone-mode: false
      - name: Esperar o deploy da publicação nova
        if: github.event_name == 'workflow_run'
        # a rota lê o gold empacotado no deploy da Vercel, que nasce do push do pipeline
        run: sleep 600

      - name: Disparar envio do resumo
        env:
          BOLETIM_SECRET: ${{ secrets.BOLETIM_SECRET }}
          SIMULAR: ${{ github.event_name == 'workflow_dispatch' && inputs.simular || false }}
        # Continua somente resposta bem-sucedida com pendentes; não repete erro HTTP/transporte.
        run: python3 scripts/disparar_resumo.py
