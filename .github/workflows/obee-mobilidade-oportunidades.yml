name: OBEE Mobilidade - oportunidades e evidências
on:
  pull_request:
    paths:
      - '.github/workflows/obee-mobilidade-oportunidades.yml'
      - 'pipeline/eficiencia_mobilidade/oportunidades*'
permissions:
  contents: read
concurrency:
  group: obee-oportunidades-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evidencias:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/obee-mobilidade-transporte'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Coletar dados oficiais e preservar originais sem publicar
        run: |
          mkdir -p evidencias
          git rev-parse HEAD > evidencias/commit.txt
          cp pipeline/eficiencia_mobilidade/oportunidades_coletar.py evidencias/
          python3 pipeline/eficiencia_mobilidade/oportunidades_coletar.py --destino evidencias/ipea
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobilidade-oportunidades-${{ github.event.pull_request.head.sha }}
          path: evidencias/
          retention-days: 7
          if-no-files-found: error
