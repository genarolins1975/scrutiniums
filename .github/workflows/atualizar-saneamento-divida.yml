name: Atualizar dívida dos prestadores de saneamento

# Observatório do Saneamento, capítulo 7.1 (dívida e alavancagem dos prestadores com registro na CVM): recoleta do
# cadastro de companhias abertas, da DFP (anual, desde 2010) e do ITR (trimestral, desde 2015) no portal de dados
# abertos da CVM e publicação pelo motor comum por grupo (scripts/atualizacao_por_grupo.py,
# config/atualizacao/saneamento-divida.json). A gold (public/saneamento/divida) é reconstruída do seed e só é
# publicada com os testes verdes: balanço que fecha, dívida que soma as subcontas, escala plausível, depreciação com o
# sinal certo, companhias esperadas na DFP mais recente e nenhum indicador ausente sem motivo. Reprovado, a publicação
# anterior continua no ar, a issue é aberta ou comentada e a execução fica vermelha.
#
# Cadência pela fonte (trimestral): a DFP vence até 31 de março e o ITR até 45 dias depois do fim do trimestre (15 de
# maio, 14 de agosto e 14 de novembro); a CVM regrava os ZIPs dos anos recentes quando chegam reapresentações. Uma
# execução logo depois de cada prazo (7 de abril e dia 22 de maio, agosto e novembro) e uma segunda passada três
# semanas depois para quem entregou com atraso (28 de abril e dia 12 de junho, setembro e dezembro). Dado igual não
# gera commit (o sinal é o hash_dados da gold).
on:
  schedule:
    - cron: "23 11 7,28 4 *" # 7 e 28 de abril, 08:23 em São Paulo (DFP)
    - cron: "23 11 22 5,8,11 *" # dia 22 de maio, agosto e novembro (ITR)
    - cron: "23 11 12 6,9,12 *" # dia 12 de junho, setembro e dezembro (entregas atrasadas)
  workflow_dispatch:
    inputs:
      sem_coleta:
        description: "Pular a coleta e só reconstruir a gold a partir do seed (publica se mudou e os testes passarem)"
        type: boolean
        default: false
      grupos:
        description: "Coletar só estes grupos (ids separados por vírgula; vazio = todos)"
        type: string
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: atualizar-saneamento-divida
  cancel-in-progress: false

env:
  CONFIG: config/atualizacao/saneamento-divida.json
  TITULO_ISSUE: "Atualização agendada da dívida dos prestadores de saneamento: publicação retida ou coleta com falha"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # 17 ZIPs da DFP (cerca de 13 MB cada) e 12 do ITR (cerca de 30 MB cada); cada comando tem teto próprio na configuração
    timeout-minutes: 90
    outputs:
      relatado: ${{ steps.issue.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node para os testes de contrato
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Dependências da interface
        run: npm ci

      - name: Coletar, reconstruir e decidir a publicação por grupo
        id: ciclo
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SEM_COLETA: ${{ inputs.sem_coleta }}
          GRUPOS: ${{ inputs.grupos }}
        run: |
          ARGS=()
          if [ "$SEM_COLETA" = "true" ]; then ARGS+=(--sem-coleta); fi
          if [ -n "$GRUPOS" ]; then ARGS+=(--grupos "$GRUPOS"); fi
          python3 -u scripts/atualizacao_por_grupo.py ciclo "$CONFIG" "${ARGS[@]}"

      # Só os grupos aprovados e a gold, com rebase sobre o ramo e quatro tentativas. Se a gold ou o seed mudaram no
      # ramo durante a execução, não publica (a composição foi testada sobre outra base); se o código mudou, reconstrói
      # e testa com o código novo antes de empurrar.
      - name: Commit e push dos grupos aprovados
        id: publicar
        if: always() && steps.ciclo.outputs.publicavel == '1'
        run: |
          git config user.name "pipeline-observatorio[bot]"
          git config user.email "pipeline@scrutiniums.com"
          python3 -u scripts/atualizacao_por_grupo.py publicar "$CONFIG" --ramo "$GITHUB_REF_NAME"

      - name: Abrir ou comentar a issue de retenção
        id: issue
        if: always() && (steps.ciclo.outcome != 'success' || steps.publicar.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUBLICACAO: ${{ steps.publicar.outcome }}
        run: |
          CORPO=.atualizacao/saneamento-divida/relatorio.md
          mkdir -p .atualizacao/saneamento-divida
          if [ ! -s "$CORPO" ]; then
            printf 'Execução: %s\n\nO ciclo terminou sem relatório (falha antes de gravar). Ver o log do passo *Coletar, reconstruir e decidir*.\n' "$RUN_URL" > "$CORPO"
          fi
          if [ "$PUBLICACAO" = "failure" ]; then
            printf '\n**A publicação dos grupos aprovados falhou** (passo *Commit e push*): nada foi empurrado.\n' >> "$CORPO"
          fi
          scripts/issue_dedup.sh "$TITULO_ISSUE" "$CORPO"

      - name: Guardar resultado, relatório e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atualizacao-saneamento-divida
          include-hidden-files: true
          path: .atualizacao/saneamento-divida/
          if-no-files-found: warn
          retention-days: 30

      # Retenção deixa a execução VERMELHA: de 25/09 a 12/10/2026 o Crédito reteve a gold com o
      # workflow verde e ninguém viu (OPERACOES.md, terceira memória).
      - name: Sinalizar publicação retida
        if: always() && (steps.ciclo.outcome != 'success' || steps.publicar.outcome == 'failure')
        run: |
          echo "::error::grupo retido, coleta com falha ou publicação não concluída; ver a issue '$TITULO_ISSUE'"
          exit 1

  # Tempo esgotado ou cancelamento não chegam ao passo da issue: este job cobre esses casos.
  alertar:
    runs-on: ubuntu-latest
    needs: pipeline
    if: always() && needs.pipeline.outputs.relatado != 'true' && (needs.pipeline.result == 'failure' || needs.pipeline.result == 'cancelled')
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Abrir ou comentar issue de interrupção
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADO: ${{ needs.pipeline.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'Execução de %s UTC terminou com **%s** antes do relatório (tempo esgotado, cancelamento ou falha de preparo): %s\n\nNada foi publicado.\n' \
            "$(date -u +%d/%m/%Y\ %H:%M)" "$RESULTADO" "$RUN_URL" > /tmp/corpo.md
          scripts/issue_dedup.sh "$TITULO_ISSUE" /tmp/corpo.md
