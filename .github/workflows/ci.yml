name: CI

# Toda mudança passa pelos testes ANTES do merge. Até 06/08/2026 este workflow
# não existia: dezenove pull requests entraram verificados apenas em sessão, e
# um teste quebrado em clone limpo (moradia-data) ficou semanas mascarando a
# cor real da suíte. O CI é o que transforma "testado na minha máquina" em
# propriedade do repositório.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # O ciclo diário de dados commita em main com GITHUB_TOKEN, e push de bot
  # NÃO dispara workflows — 6 ciclos (13-19/08) quebraram 8 testes gated sem
  # nenhum sinal vermelho. A suíte roda sobre o main assim que o pipeline
  # termina (workflow_run), em vez de num horário fixo: o pipeline vinha
  # começando com 3 a 11 h de atraso desde 27/08 e o cron das 11:45 UTC
  # testava o gold do dia anterior (auditoria de 06/09/2026, achado T2).
  workflow_run:
    workflows: ["Atualizar dados do Observatório"]
    types: [completed]
  schedule:
    # reserva: se o workflow_run não disparar, ainda há uma passagem diária
    - cron: "45 17 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: npm ci

      - name: Gerar app.min.js
        # o minificado é gitignorado (artefato de build) e os testes de
        # exportação o comparam com o fonte — num clone limpo ele não existe.
        # Primeira captura real do CI: run nº 2 falhou exatamente aqui (ENOENT).
        run: node scripts/minify-obs.mjs

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npx tsc --noEmit

      - name: Módulos Python compilam
        # sem instalar dependências: o pipeline é stdlib + pypdf, e aqui só
        # interessa pegar erro de sintaxe/import antes do agendamento das 6h
        run: python3 -m compileall -q pipeline

      - name: Dependências do pipeline de energia
        # pyarrow: leitura dos Parquet da ANEEL nos módulos de energia
        run: pip install -r pipeline/energia/requirements.txt

      - name: Testes Python (pipeline e camada de pesquisa)
        # stdlib, sem rede: regra nominal, relatório automático, pacote de fatos,
        # validador e casos sentinela, conferidos contra a gold publicada; nada
        # aqui escreve em data/ ou public/
        run: |
          python3 -m unittest discover -s pipeline/tests -t .
          python3 -m unittest discover -s pesquisa/tests -t .
          python3 -m unittest pipeline.eficiencia_resultados.test_motor pipeline.eficiencia_resultados.test_expansao pipeline.eficiencia_resultados.test_saude_municipal pipeline.eficiencia_resultados.test_precisao_saude pipeline.eficiencia_resultados.test_captura_recaptura pipeline.eficiencia_resultados.test_habitacao pipeline.eficiencia_resultados.test_habitacao_cenarios pipeline.eficiencia_resultados.test_conectividade pipeline.eficiencia_resultados.test_cesta_conjunta pipeline.eficiencia_resultados.test_precisao_candidatas pipeline.eficiencia_resultados.test_revisao_v3

      - name: Reconciliação aritmética alternativa do OBEE
        run: |
          python3 -m unittest scripts.test_auditar_cesta_obee_v3
          # o relatório versionado precisa ser exatamente o que o auditor produz hoje
          python3 scripts/auditar-cesta-obee-v3.py | python3 -c "import json,sys; sys.exit(json.load(sys.stdin) != json.load(open('docs/obee/resultados/reconciliacao-aritmetica-v3.json')))"
          python3 -m unittest scripts.test_obee_sensibilidade_pares scripts.test_obee_robustez_ampliada
          # a prévia versionada precisa ser a saída do gerador (dados, robustez e ressalva)
          python3 docs/obee/resultados/review-ui/generate.py
          git diff --exit-code docs/obee/resultados/revisao-interativa-v3.html

      - name: Precisão complementar da cesta OBEE
        run: |
          python3 -m unittest scripts.test_obee_precisao_cesta
          python3 scripts/obee_precisao_cesta.py --check
          python3 -m unittest scripts.test_obee_renda_sensibilidade
          python3 scripts/obee_renda_sensibilidade.py --check

      - name: Índice de resultados v4 do OBEE
        run: |
          python3 -m unittest pipeline.eficiencia_resultados.test_indice_v4
          # as saídas versionadas precisam ser exatamente o que o cálculo produz hoje
          python3 -m pipeline.eficiencia_resultados.indice_v4 --check
          # código, saídas, decisões e fontes conferem com o pacote congelado da edição
          python3 -m pipeline.eficiencia_resultados.indice_v4 --verificar
          # a interface, fora do pacote, confere com o seu manifesto complementar
          python3 scripts/obee_interface_v4.py --check
          # os contornos da entrada são os do recorte versionado da malha do IBGE
          python3 scripts/obee_contornos_capitais.py --check

      - name: Build de produção
        # gera o HTML pré-renderizado (.next/server/app) do MESMO commit testado, no mesmo
        # job, sem credenciais de produção: as páginas são estáticas. Até 08/10/2026 este
        # workflow não gerava build, e o teste que inspeciona o HTML (undefined, NaN, data
        # ISO crua) retornava cedo por falta do diretório: passava sem verificar nada.
        run: npm run build

      - name: Testes (inclui a verificação obrigatória do HTML gerado)
        # EXIGIR_BUILD_HTML=1 faz src/tests/html-gerado.test.ts reprovar se o build, uma rota
        # esperada ou as páginas a inspecionar não existirem. O log mostra "HTML verificado
        # (...): N páginas" quando a asserção realmente rodou.
        env:
          EXIGIR_BUILD_HTML: "1"
        run: npx vitest run

      - name: Árvore versionada permanece limpa após build e testes
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=normal)"
