name: OBEE Mobilidade - contratos editoriais
on:
  pull_request:
    paths:
      - '.github/workflows/obee-mobilidade-evidencias.yml'
permissions:
  contents: read
jobs:
  contratos:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preservar testes versionados e fontes pertinentes à revisão
        run: |
          python3 - <<'PY'
          import pathlib, shutil, subprocess
          root=pathlib.Path('evidencias-contratos'); root.mkdir()
          names=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          paths=[pathlib.Path(n) for n in names if '.test.' in n and n.endswith(('.ts','.tsx','.js','.mjs'))]
          for p in paths:
              text=p.read_text()
              if 'casca' in text or 'amostras' in text or 'PAIF e PAEFI' in text:
                  print('CONTRATO',p)
          paths.extend([pathlib.Path('src/app/eficiencia-estatal/page.tsx'),pathlib.Path('src/components/eficiencia/mobilidade/PainelMobilidade.tsx'),pathlib.Path('src/middleware.ts')])
          for p in paths:
              dest=root/p;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,dest)
          print('Arquivos de código:',len(paths))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: obee-mobilidade-contratos-${{ github.event.pull_request.head.sha }}
          path: evidencias-contratos/
          retention-days: 3
          if-no-files-found: error
