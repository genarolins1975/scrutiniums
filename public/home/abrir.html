<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Abrindo no Obsidian</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 48px 16px; text-align: center; }
  a { display: inline-block; margin-top: 16px; padding: 12px 20px; border-radius: 8px; background: #4f46e5; color: #fff; text-decoration: none; }
  #nome { display: block; margin-top: 8px; opacity: .7; word-break: break-word; }
</style>
</head>
<body>
<p>Abrindo no Obsidian.</p>
<span id="nome"></span>
<a id="abrir" href="#">Abrir no Obsidian</a>
<script>
  // O caminho vem depois do #, então nunca é enviado ao servidor.
  var dados = new URLSearchParams(location.hash.slice(1));
  var arquivo = dados.get("f");
  if (arquivo) {
    var destino = "obsidian://open?vault=" + encodeURIComponent(dados.get("v") || "Tudo aqui") +
      "&file=" + encodeURIComponent(arquivo);
    document.getElementById("nome").textContent = arquivo.split("/").pop();
    document.getElementById("abrir").href = destino;
    location.replace(destino);
  }
</script>
</body>
</html>
