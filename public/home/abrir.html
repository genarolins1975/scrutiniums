<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Abrindo o arquivo</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 48px 16px; text-align: center; }
  a { display: inline-block; margin-top: 16px; padding: 12px 20px; border-radius: 8px; background: #4f46e5; color: #fff; text-decoration: none; }
  #nome { display: block; margin-top: 8px; opacity: .7; word-break: break-word; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<p id="aviso">Link de arquivo pessoal.</p>
<span id="nome"></span>
<a id="abrir" href="#" hidden>Abrir o arquivo</a>
<script>
  // O caminho vem depois do #, então nunca é enviado ao servidor.
  var dados = new URLSearchParams(location.hash.slice(1));
  var arquivo = dados.get("f");
  if (arquivo) {
    var ultimo = arquivo.split("/").pop();
    if (!/\.[A-Za-z0-9]{1,5}$/.test(ultimo)) arquivo += ".md";
    var cofre = dados.get("v") || "Tudo aqui";
    var celular = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var caminho = (cofre + "/" + arquivo).split("/").map(encodeURIComponent).join("/");
    var destino = celular
      ? "shareddocuments:///private/var/mobile/Library/Mobile%20Documents/iCloud~md~obsidian/Documents/" + caminho
      : "acervo://abrir?f=" + encodeURIComponent(arquivo);
    document.getElementById("aviso").textContent = "Abrindo o arquivo.";
    document.getElementById("nome").textContent = arquivo.split("/").pop();
    var botao = document.getElementById("abrir");
    botao.href = destino;
    botao.hidden = false;
    location.replace(destino);
  }
</script>
</body>
</html>
